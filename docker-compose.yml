version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: syndicate-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: syndicate_ledger_db_0
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d syndicate_ledger_db_0"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - syndicate-network

  # Backend API (NestJS)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: syndicate-backend
    environment:
      NODE_ENV: development
      API_PORT: 3000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/syndicate_ledger_db_0
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: syndicate_ledger_db_0
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      JWT_SECRET: your_super_secret_key_min_32_chars_long_change_me
      JWT_EXPIRY: 24h
      FRONTEND_URL: http://localhost:5173
      DOCUMENT_STUDIO_URL: http://document-studio:5000
      USD_SYP_RATE: 15000
      LOG_LEVEL: debug
      ENABLE_QUERY_LOGGING: "true"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - backend_node_modules:/app/node_modules
    networks:
      - syndicate-network
    command: npm run start:dev

  # Frontend (Vite + React)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: syndicate-frontend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_NODE_ENV: development
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - frontend_node_modules:/app/node_modules
    networks:
      - syndicate-network
    depends_on:
      - backend

  # Document Studio (Python PDF Service)
  document-studio:
    build:
      context: ./document-studio
      dockerfile: Dockerfile
    container_name: syndicate-document-studio
    environment:
      SERVICE_PORT: 5000
      NODE_ENV: development
      API_BASE_URL: http://backend:3000
      API_JWT_SECRET: your_super_secret_key_min_32_chars_long_change_me
      LOG_LEVEL: DEBUG
      OUTPUT_DIR: /app/output
    ports:
      - "5000:5000"
    volumes:
      - ./document-studio:/app
      - document_studio_output:/app/output
    networks:
      - syndicate-network
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
  backend_node_modules:
    driver: local
  frontend_node_modules:
    driver: local
  document_studio_output:
    driver: local

networks:
  syndicate-network:
    driver: bridge
